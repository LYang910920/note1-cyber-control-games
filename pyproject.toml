[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "note1-cyber-control-games"
version = "0.2.0"
description = "Sampled cyber control, reinforcement learning, and multi-agent games."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "NOTICE.md"]
authors = [{name = "Luxing Yang"}]
dependencies = [
    "torch>=2.2,<3",
    "cybercontrol @ git+https://github.com/LYang910920/network-control-differential-games.git@eedae9f86ddadfa1ccfc306ad88c1020c01c679d",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff==0.17.3"]

[project.scripts]
cybergames = "cybergames.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests", "scripts"]
target-version = "py310"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402", "E741"]

name: Quality

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install foundation and Note 1
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          if ! git clone --depth 1 --branch codex/full-research-upgrade https://github.com/LYang910920/network-control-differential-games.git /tmp/foundation; then
            rm -rf /tmp/foundation
            git clone --depth 1 https://github.com/LYang910920/network-control-differential-games.git /tmp/foundation
          fi
          python -m pip install /tmp/foundation
          python -m pip install --no-deps -e ".[dev]"
      - name: Static and unit checks
        run: |
          python -m compileall -q src tests scripts
          ruff check .
          ruff format --check src tests scripts
          pytest -q
      - name: Public smoke and figures
        run: |
          python -m cybergames smoke
          python -m cybergames figures
